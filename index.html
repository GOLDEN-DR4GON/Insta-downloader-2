<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Instagram Reels Downloader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ───── reset & base ───── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
            /* dynamic background – clear blend */
            background-image: url('https://i.ibb.co/V0BL2Fwm/02239528-fe28-45b2-8d4a-ced420932bfe.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-blend-mode: normal;
            background-color: rgba(8, 6, 18, 0.50);
            transition: background-color 0.4s ease;
        }

        /* ───── main card – clear glassmorphism, no layered feel ───── */
        .card {
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(32px) saturate(1.4);
            -webkit-backdrop-filter: blur(32px) saturate(1.4);
            border-radius: 2.5rem;
            padding: 2.4rem 2rem 1.8rem;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
            /* single glass layer – no pseudo elements for extra depth */
        }

        /* ───── header ───── */
        .header {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            margin-bottom: 0.1rem;
        }

        .header .icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.6rem;
            height: 2.6rem;
            background: linear-gradient(145deg, #f09433, #e6683c, #dc2743, #cc2366);
            border-radius: 1rem;
            box-shadow: 0 6px 20px rgba(220, 40, 70, 0.12);
            flex-shrink: 0;
        }

        .header .icon-wrap i {
            font-size: 1.4rem;
            color: white;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.1));
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #f5f0ff;
            letter-spacing: -0.3px;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
        }

        h1 span {
            font-weight: 300;
            color: rgba(255, 255, 255, 0.40);
            letter-spacing: 0.1px;
        }

        /* ───── sub – clear instruction ───── */
        .sub {
            color: rgba(255, 255, 255, 0.50);
            font-weight: 400;
            font-size: 0.85rem;
            margin: 0.3rem 0 1.6rem 0;
            padding-left: 0.2rem;
            letter-spacing: 0.2px;
            border-left: 3px solid rgba(167, 139, 250, 0.4);
            padding-left: 0.9rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 0 30px 30px 0;
            padding: 0.4rem 1rem 0.4rem 1rem;
            backdrop-filter: blur(4px);
            display: inline-block;
        }

        .sub i {
            color: #a78bfa;
            margin-right: 8px;
            font-size: 0.8rem;
        }

        /* ───── input group – clear glass ───── */
        .input-group {
            background: rgba(0, 0, 0, 0.18);
            border-radius: 60px;
            padding: 0.1rem 0.1rem 0.1rem 1.6rem;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            transition: 0.3s;
            margin-bottom: 1rem;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.10);
        }

        .input-group:focus-within {
            border-color: rgba(167, 139, 250, 0.25);
            box-shadow: 0 0 30px rgba(167, 139, 250, 0.04), inset 0 1px 3px rgba(0, 0, 0, 0.10);
            background: rgba(0, 0, 0, 0.25);
        }

        .input-group i {
            color: rgba(255, 255, 255, 0.20);
            font-size: 1rem;
            margin-right: 10px;
            transition: 0.2s;
        }

        .input-group:focus-within i {
            color: #a78bfa;
        }

        #urlInput {
            background: transparent;
            border: none;
            padding: 0.9rem 0.4rem;
            font-size: 0.95rem;
            color: #f5f0ff;
            width: 100%;
            outline: none;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        #urlInput::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        /* ───── download button – normal, no arrow ───── */
        .btn-download {
            background: linear-gradient(145deg, rgba(167, 139, 250, 0.75), rgba(124, 95, 216, 0.75));
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
            box-shadow: 0 6px 24px rgba(120, 80, 200, 0.12);
            letter-spacing: 0.3px;
            white-space: nowrap;
            width: auto;
        }

        .btn-download:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 36px rgba(120, 80, 200, 0.20);
            background: linear-gradient(145deg, rgba(184, 156, 255, 0.80), rgba(138, 111, 224, 0.80));
        }

        .btn-download:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px rgba(120, 80, 200, 0.10);
        }

        .btn-download i {
            font-size: 0.9rem;
        }

        .action-wrap {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            margin-top: 0.1rem;
        }

        .action-hint {
            display: flex;
            gap: 8px;
            align-items: center;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.75rem;
            font-weight: 350;
            letter-spacing: 0.3px;
        }

        .action-hint i {
            color: rgba(255, 255, 255, 0.10);
            font-size: 0.8rem;
        }

        .action-hint .sep {
            color: rgba(255, 255, 255, 0.05);
        }

        /* ───── status – clear glass ───── */
        .status-msg {
            margin-top: 1.4rem;
            padding: 0.6rem 1.1rem;
            border-radius: 60px;
            background: rgba(0, 0, 0, 0.15);
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.85rem;
            border-left: 4px solid rgba(167, 139, 250, 0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(6px);
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .status-msg i {
            color: #a78bfa;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        #statusText {
            word-break: break-all;
            font-weight: 400;
            letter-spacing: 0.1px;
            color: rgba(255, 255, 255, 0.70);
        }

        /* ───── footer ───── */
        .footer-credit {
            margin-top: 2rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .footer-credit .badge {
            background: rgba(255, 255, 255, 0.02);
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            font-size: 0.65rem;
            border: 1px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.4px;
            font-weight: 400;
            backdrop-filter: blur(4px);
        }

        .footer-credit .badge i {
            color: #a78bfa;
            margin-right: 5px;
            font-size: 0.6rem;
        }

        .footer-credit .made-by {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 350;
            font-size: 0.8rem;
            letter-spacing: 0.2px;
        }

        .footer-credit .made-by strong {
            color: #a78bfa;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: rgba(167, 139, 250, 0.05);
            padding: 0.05rem 0.5rem;
            border-radius: 40px;
        }

        .footer-credit .made-by i {
            color: #a78bfa;
            margin: 0 3px;
            font-size: 0.7rem;
        }

        /* ───── responsive ───── */
        @media (max-width: 500px) {
            .card {
                padding: 1.6rem 1.2rem 1.4rem;
                border-radius: 2rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .header .icon-wrap {
                width: 2.2rem;
                height: 2.2rem;
            }
            .header .icon-wrap i {
                font-size: 1.1rem;
            }
            .input-group {
                padding-left: 1rem;
                flex-wrap: wrap;
            }
            .btn-download {
                width: 100%;
                justify-content: center;
                padding: 0.8rem 1.5rem;
            }
            .action-wrap {
                flex-direction: column;
                align-items: stretch;
                gap: 0.6rem;
            }
            .footer-credit {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .sub {
                font-size: 0.75rem;
                padding: 0.35rem 0.9rem;
                margin-bottom: 1.2rem;
            }
            .action-hint {
                font-size: 0.7rem;
                justify-content: center;
            }
            #urlInput {
                font-size: 0.9rem;
                padding: 0.8rem 0.3rem;
            }
            .status-msg {
                font-size: 0.8rem;
                padding: 0.5rem 1rem;
            }
        }

        /* extra small devices */
        @media (max-width: 380px) {
            .card {
                padding: 1.2rem 0.9rem 1rem;
                border-radius: 1.6rem;
            }
            h1 {
                font-size: 1.3rem;
            }
            .header .icon-wrap {
                width: 2rem;
                height: 2rem;
            }
            .header .icon-wrap i {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- header -->
        <div class="header">
            <div class="icon-wrap">
                <i class="fab fa-instagram"></i>
            </div>
            <h1>Reels <span>Downloader</span></h1>
        </div>

        <div class="sub">
            <i class="fas fa-arrow-down"></i> Paste URL &amp; press Enter or tap Download
        </div>

        <!-- input – only reel url -->
        <div class="input-group">
            <i class="fas fa-link"></i>
            <input type="text" id="urlInput" placeholder="Paste Instagram Reel URL ..." value="https://www.instagram.com/reel/CxAMPLE/" />
        </div>

        <!-- action -->
        <div class="action-wrap">
            <span class="action-hint">
                <i class="fas fa-enter"></i> Enter
                <span class="sep">|</span>
                <i class="fas fa-mouse-pointer"></i> tap
            </span>
            <button class="btn-download" id="downloadBtn">
                <i class="fas fa-download"></i> Get Reel
            </button>
        </div>

        <!-- status -->
        <div class="status-msg" id="statusMsg">
            <i class="fas fa-info-circle"></i>
            <span id="statusText">✦ ready · paste a reel link</span>
        </div>

        <!-- footer -->
        <div class="footer-credit">
            <span class="badge"><i class="fas fa-check-circle"></i> instagram tool</span>
            <span class="made-by">
                <i class="fas fa-code"></i> made by <strong>zack</strong> <i class="fas fa-crown" style="color: #f7d44b;"></i>
            </span>
        </div>

    </div>

    <script>
        (function() {
            const urlInput = document.getElementById('urlInput');
            const downloadBtn = document.getElementById('downloadBtn');
            const statusText = document.getElementById('statusText');
            const statusMsg = document.getElementById('statusMsg');

            const BASE_ENDPOINT = 'http://172.105.69.123:10000/download?url=';

            function setStatus(message, isError = false) {
                statusText.textContent = message;
                statusMsg.style.borderLeftColor = isError ? '#f87171' : 'rgba(167, 139, 250, 0.4)';
                statusMsg.style.background = isError ? 'rgba(248, 113, 113, 0.06)' : 'rgba(0, 0, 0, 0.15)';
                const icon = isError ? 'exclamation-triangle' : 'info-circle';
                const color = isError ? '#f87171' : '#a78bfa';
                statusMsg.innerHTML =
                    `<i class="fas fa-${icon}" style="color: ${color};"></i> <span id="statusText">${message}</span>`;
                const newStatusText = document.getElementById('statusText');
                if (newStatusText) {
                    newStatusText.style.color = isError ? '#fca5a5' : 'rgba(255,255,255,0.70)';
                }
            }

            function handleDownload() {
                let rawUrl = urlInput.value.trim();
                if (!rawUrl) {
                    setStatus('⚠️ Please paste an Instagram Reel URL first.', true);
                    return;
                }

                if (!rawUrl.includes('instagram.com') && !rawUrl.includes('instagr.am')) {
                    setStatus('❌ That doesn\'t look like an Instagram link.', true);
                    return;
                }

                const fullUrl = BASE_ENDPOINT + encodeURIComponent(rawUrl);
                try {
                    window.open(fullUrl, '_blank');
                    const short = rawUrl.length > 45 ? rawUrl.substring(0, 45) + '…' : rawUrl;
                    setStatus(`✅ Download started for: ${short}`);
                } catch (e) {
                    setStatus('❌ Could not open download. Check endpoint.', true);
                    console.warn('Download error:', e);
                }
            }

            downloadBtn.addEventListener('click', handleDownload);
            urlInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleDownload();
                }
            });

            setStatus('✦ ready · paste a reel link');
            window.downloadReel = handleDownload;
        })();
    </script>

</body>
</html>
